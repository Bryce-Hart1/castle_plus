# Claude — Date 06/19/2026
# castle++ services manifest. Each [section] is one supervised backend.
# Pass it with:  castle --services /path/to/services.conf
#
# Keys:
#   exec            absolute path to the binary (required)
#   args            arguments after exec; whitespace-split, "quotes" supported
#   workdir         chdir here before exec (optional)
#   kind            what the backend is, for control commands that look inside
#                   it (optional). Only `swiftsearch` exists: it makes the
#                   service show up in the `swiftsearch` control command
#   autorestart     relaunch on exit? true/false (default true)
#   health_tcp      host:port for a periodic TCP health check (optional)
#   health_interval seconds between health checks (default 5)
#   backoff_min     first restart delay, seconds (default 1)
#   backoff_max     max restart delay, seconds (default 30)
#
# The examples below use binaries present in the demo image (busybox, sleep) so
# this runs as-is with routes.conf for an end-to-end proxy test. Replace them
# with your real app backends.

# A real HTTP backend on :9001 that routes.conf's [web] route points at.
[web]
exec = /bin/busybox
args = httpd -f -p 127.0.0.1:9001 -h /srv
autorestart = true
health_tcp = 127.0.0.1:9001
health_interval = 5

# A non-HTTP process, just to show the supervisor manages anything.
[sleeper]
exec = /bin/sleep
args = 3600
autorestart = true

# swiftSearch as the vault; pair with the [vault] route. Keep --bind 127.0.0.1
# and never pass --admin. Never run two copies on one --store. -j sets memory
# as well as threads: worst case is about 64 MiB x 5 x j (~640 MiB at -j 2).
# workdir is where it writes its swiftSearchLogs file. kind = swiftsearch lets
# the `swiftsearch` control command read its store, disk, keys and log; it
# takes the store, port and limits from args, so keep them there.
# [vault]
# exec        = /opt/swiftsearch/swiftSearch
# args        = serve --store /var/lib/swiftsearch --bind 127.0.0.1 --port 9101 -j 2 --mem-cap 256M
# workdir     = /var/lib/swiftsearch-logs
# kind        = swiftsearch
# autorestart = true
# health_tcp  = 127.0.0.1:9101
