# Claude — Date 06/19/2026
# castle++ routing table. Each [section] maps (Host, path-prefix) to a backend.
# Pass it with:  castle --routes /path/to/routes.conf   (enables HTTP proxy mode)
#
# Keys:
#   host      match the request's Host header (optional; omit = match any host)
#   path      request path must start with this prefix (default "/")
#   backend   where to forward: IPv4:port  (hostnames/DNS are a follow-up)
#
# Most specific match wins: longest path-prefix first, host-specific over
# wildcard. Backends are plain IPv4 for now.

[web]
host = web.local
path = /
backend = 127.0.0.1:9001

# Example of path-based routing to a second backend (uncomment + run one there):
# [api]
# host = web.local
# path = /api
# backend = 127.0.0.1:9002
