# Claude — Date 06/19/2026
# castle++ routing table. Each [section] maps (Host, path-prefix) to a backend.
# Pass it with:  castle --routes /path/to/routes.conf   (enables HTTP proxy mode)
#
# Keys:
#   host      match the request's Host header (optional; omit = match any host)
#   path      request path must start with this prefix (default "/")
#   backend   where to forward: IPv4:port  (hostnames/DNS are a follow-up)
#   max_body  body cap for this route, bytes with optional K/M/G (default:
#             the global --max-body; 0 = unlimited)
#   allow     whitespace-separated path prefixes this route forwards; anything
#             else gets 404 at castle (default: every path)
#   auth      token file; every request needs `Authorization: Bearer <token>`
#             (or Basic with the token as password) -> 401/403 otherwise. The
#             header is consumed here and never forwarded. Reloaded on SIGHUP.
#             Lines are `rw <sha256 hex>` or `ro <sha256 hex>` (ro = GET/HEAD
#             only). Make one with:
#               t=$(openssl rand -hex 32); echo "$t"; printf %s "$t" | sha256sum
#
# Most specific match wins: longest path-prefix first, host-specific over
# wildcard. Backends are plain IPv4 for now.

[web]
host = web.local
path = /
backend = 127.0.0.1:9001

# Example of path-based routing to a second backend (uncomment + run one there):
# [api]
# host = web.local
# path = /api
# backend = 127.0.0.1:9002

# swiftSearch as a "vault" (key -> bytes). It has no auth or TLS of its own and
# binds 127.0.0.1, so castle is its only ingress and its security boundary.
# The allowlist keeps /v1/admin/ (and anything added later) unreachable; the
# body cap matches swiftSearch's own 64 MiB limit so oversized uploads are
# refused here instead of streamed. Pair with the [vault] service.
# [vault]
# host     = vault.<domain>
# path     = /
# backend  = 127.0.0.1:9101
# max_body = 64M
# allow    = /v1/blobs/ /v1/prepare/ /healthz
# auth     = /opt/castle/config/vault.tokens
